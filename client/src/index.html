<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Document Info Retriever</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Upload a document and ask questions about it. Every answer cites the page it came from."
    />
    <meta name="theme-color" content="#060914" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eaeefa" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Set the theme before first paint so there's no white flash on reload. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('dir_theme');
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          document.documentElement.dataset.theme = saved || (prefersLight ? 'light' : 'dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
