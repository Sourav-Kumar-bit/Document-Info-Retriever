<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />

    <!-- Site name lives in exactly two places: here, and the brand block in
         app.html. Change both if you rename it. -->
    <title>Pagewise — ask your documents</title>

    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Upload a PDF and ask it anything. Every answer cites the page it came from."
    />

    <!-- SVG first: modern browsers prefer it and it stays sharp at any size.
         The .ico is the fallback for older browsers and Windows pinned tiles. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />

    <meta name="theme-color" content="#05070f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#e6ebf8" media="(prefers-color-scheme: light)" />

    <meta property="og:title" content="Pagewise" />
    <meta property="og:description" content="Ask a document anything. Every answer cites its page." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="icon-512.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Resolve the theme before first paint, or every reload flashes white. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('dir_theme');
          var light = window.matchMedia('(prefers-color-scheme: light)').matches;
          document.documentElement.dataset.theme = saved || (light ? 'light' : 'dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
