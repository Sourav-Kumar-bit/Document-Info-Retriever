<!-- Three calm layers. The ruled paper is what the glass refracts. -->
<div class="page-bg" aria-hidden="true"></div>
<div class="page-rules" aria-hidden="true"></div>
<div class="page-grain" aria-hidden="true"></div>

<a class="skip" href="#stage">Skip to the conversation</a>

<header class="topbar panel">
  <div class="brand">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 32 32">
        <rect x="5" y="7" width="16" height="20" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.32" />
        <rect x="8.5" y="4.5" width="16" height="20" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.6" />
        <path d="M12 11h9M12 15h9M12 19h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        <circle cx="21.5" cy="20.5" r="5" fill="none" stroke="var(--amber)" stroke-width="2" />
        <path d="m25.4 24.4 4 4" stroke="var(--amber)" stroke-width="2" stroke-linecap="round" />
      </svg>
    </span>
    <span class="brand-text">
      <b>Pagewise</b>
      <small class="mono">grounded answers, cited pages</small>
    </span>
  </div>

  <nav class="tabs" aria-label="Sections">
    @for (p of panes; track p.id) {
      <button type="button" class="tab" [class.on]="pane() === p.id" (click)="show(p.id)"
              [attr.aria-current]="pane() === p.id ? 'page' : null">{{ p.label }}</button>
    }
  </nav>

  <div class="tools">
    @if (store.processingCount() > 0) {
      <span class="live mono"><i></i>{{ store.processingCount() }} indexing</span>
    }
    <span class="sid mono" title="Anonymous session id">{{ session.shortId }}</span>
    <button type="button" class="swap" (click)="theme.toggle()"
            [attr.aria-label]="'Switch to ' + (theme.theme() === 'dark' ? 'light' : 'dark') + ' theme'">
      <span class="swap-knob" [class.light]="theme.theme() === 'light'">
        @if (theme.theme() === 'dark') {
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" stroke-linejoin="round" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2">
            <circle cx="12" cy="12" r="4.2" />
            <path d="M12 2.6v1.8M12 19.6v1.8M4.6 4.6l1.3 1.3M18.1 18.1l1.3 1.3M2.6 12h1.8M19.6 12h1.8M4.6 19.4l1.3-1.3M18.1 5.9l1.3-1.3" stroke-linecap="round" />
          </svg>
        }
      </span>
    </button>
  </div>
</header>

<main class="workspace">
  <aside class="region rail left" [class.on]="pane() === 'library'">
    <div class="rail-inner scroll-y">
      <app-uploader />
      <app-library />
    </div>
  </aside>

  <section id="stage" class="region stage" [class.on]="pane() === 'chat'">
    <app-chat />
  </section>

  <aside class="region rail right" [class.on]="pane() === 'insights'">
    <div class="rail-inner scroll-y">
      <app-insights />
    </div>
  </aside>
</main>
